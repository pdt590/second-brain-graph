services:
  second-brain:
    build: .
    container_name: second-brain
    restart: unless-stopped
    ports:
      - "${SECOND_BRAIN_PORT:-3030}:3030"
    volumes:
      # Wiki directory (read-only mount at /wiki in the container)
      - "${HERMES_WIKI_DIR:-./wiki}:/wiki:ro"
      # Persist authentication credentials and chat history
      - second-brain-data:/app/data
      # Optional: mount Hermes .env for automatic API key discovery
      # - "${HOME}/.hermes/.env:/root/.hermes/.env:ro"
    environment:
      - HERMES_WIKI_DIR=/wiki
      - SECOND_BRAIN_HOST=0.0.0.0
      - SECOND_BRAIN_PORT=3030
      - SECOND_BRAIN_ADMIN_USER=${SECOND_BRAIN_ADMIN_USER:-admin}
      - SECOND_BRAIN_ADMIN_PASSWORD=${SECOND_BRAIN_ADMIN_PASSWORD:-}
      - API_SERVER_KEY=${API_SERVER_KEY:-}
      - HERMES_API_TARGET=${HERMES_API_TARGET:-}
    # If Hermes is on the same Docker network, access it by service name
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"  # Access Hermes on the host

volumes:
  second-brain-data:
    driver: local
